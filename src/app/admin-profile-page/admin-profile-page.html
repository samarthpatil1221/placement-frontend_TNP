<div class="profile-page">
    <h2>Admin Profile</h2>
  
    <form [formGroup]="profileForm" (ngSubmit)="onSubmit()">
  
      <div class="form-group">
        <label>Username</label>
        <input formControlName="username" [disabled]="true" />
      </div>
  
      <div class="form-group">
        <label>Full Name</label>
        <input formControlName="fullName" />
        <div class="error" *ngIf="profileForm.get('fullName')?.invalid && profileForm.get('fullName')?.touched">
          Full Name is required (min 3 characters).
        </div>
      </div>
  
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email" />
        <div class="error" *ngIf="profileForm.get('email')?.invalid && profileForm.get('email')?.touched">
          Enter a valid email.
        </div>
      </div>
  
      <div class="form-group">
        <label>New Password</label>
        <input type="password" formControlName="password" />
      </div>
  
      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" formControlName="confirmPassword" />
        <div class="error" *ngIf="hasPasswordMismatchError && profileForm.get('confirmPassword')?.touched">
          Passwords do not match.
        </div>
      </div>
  
      <div class="form-buttons">
        <button type="submit" [disabled]="loading">Update Profile</button>
      </div>
  
      <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
    </form>
  </div>
