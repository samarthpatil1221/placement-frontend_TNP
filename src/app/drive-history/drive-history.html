<div class="history-container">
  <h2>Drive History</h2>
  <p>Track your placement drive applications and results</p>

  <!-- Search + Filter -->
  <div class="search-status-row">
    <input
      type="text"
      class="search-bar"
      placeholder="Search by company Name..."
      [value]="searchText"
      (input)="onSearchTextChange($event)"
    />
  </div>

  <!-- No Result -->
  <div *ngIf="filteredDrives.length === 0">
    <p>No applied drives found.</p>
  </div>

  <!-- Drives List -->
  <div class="history-list list-view">
    <div *ngFor="let drive of filteredDrives" class="history-card">
      <div class="drive-row">
        <!-- Left Section -->
        <div class="drive-left">
          <div class="drive-icon">
            <img src="com.gif" alt="Company Logo" />
          </div>
          <div class="drive-info">
            <div class="drive-title">{{ drive.companyName }}</div>
            <div class="drive-role">{{ drive.role }}</div>
          </div>
        </div>

        <!-- Middle Section -->
        <div class="drive-details">
          <div>
            <img src="calender.png" alt="Date" class="info-icon" />
            {{ drive.dateOfDrive ? (drive.dateOfDrive | date:'MMM d, y') : 'N/A' }}
          </div>
          <div>
            <img src="location.png" alt="Location" class="info-icon" />
            {{ drive.location || 'N/A' }}
          </div>
          <div *ngIf="drive.ctc" class="ctc-text">
            <img src="assets/icons/money.svg" alt="CTC" class="info-icon" />
            {{ drive.ctc }} LPA
          </div>
        </div>

      
    </div>
  </div>
</div>
