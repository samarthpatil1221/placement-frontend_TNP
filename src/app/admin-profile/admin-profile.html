<div class="profile-container" (click)="toggleDropdown()" tabindex="0">
  <span class="username">{{ username }}</span>
  <svg class="icon" fill="currentColor" viewBox="0 0 20 20" width="20" height="20">
    <path fill-rule="evenodd"
          d="M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.27a.75.75 0 01.02-1.06z"
          clip-rule="evenodd" />
  </svg>
  <div class="dropdown" *ngIf="dropdownOpen" (click)="$event.stopPropagation()">
    <a routerLink="/admin/admin-profile-page">Profile</a>
    <a routerLink="/admin/settings">Settings</a>
    <button (click)="logout()">Logout</button>
  </div>
</div>
